<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Details</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        body {
            background-color: #fff3f3; /* Light pink */
        }

        .header {
            background-color: #a020f0; /* Purple */
            color: white;
            padding: 20px;
            text-align: center;
        }

        .custom-btn {
            background-color: #ff4500; /* Orange-Red */
            color: white;
            border: none;
        }

        .custom-btn:hover {
            background-color: #d03801; /* Darker orange-red */
        }

        .table thead {
            background-color: #ff6347; /* Tomato red */
            color: white;
        }

        .table tbody tr:nth-child(even) {
            background-color: #ffe5d9; /* Light orange background */
        }

        .actor-image {
            border-radius: 10px;
            object-fit: cover;
        }

        .footer {
            background-color: #dc143c; /* Crimson red */
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top:auto;
        }

        @media (max-width: 768px) {
            .table-responsive {
                font-size: 14px;
            }

            .actor-image {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Order Details</h1>
    <a href="/add" class="btn custom-btn mt-2">Place Your Order Here</a>
</div>

<div class="container my-4">
    <div class="table-responsive">
        <table class="table table-bordered table-striped text-center align-middle">
            <thead>
            <tr>
                <th>Id</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
                <th>Image</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="hotel : ${hotels}">
                <td th:text="${hotel.id}"></td>
                <td th:text="${hotel.productname}"></td>
                <td th:text="${hotel.quantity}"></td>
                <td th:text="${hotel.price}"></td>
                <td th:text="${hotel.total}"></td>
                <td>
                    <img th:src="@{/uploads/{fileName}(fileName=${hotel.fileName})}" alt="Product Image"
                         class="actor-image" height="120" width="120" />
                </td>
                <td>
                    <a th:href="@{/edit/{id}(id=${hotel.id})}" class="btn btn-sm custom-btn mb-1">Edit</a>
                    <a th:href="@{/delete/{id}(id=${hotel.id})}" class="btn btn-sm custom-btn">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="footer">
    &copy; 2025 Order Management System. All rights reserved.
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
