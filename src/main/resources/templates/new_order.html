<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Order</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fff0f5; /* light pink */
            font-family: 'Segoe UI', sans-serif;
        }

        .form-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffe5d9; /* light orange */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.2); /* orange glow */
        }

        .form-title {
            text-align: center;
            color: #a020f0; /* purple */
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #dc143c; /* crimson */
        }

        .form-control:focus {
            border-color: #a020f0;
            box-shadow: 0 0 5px #a020f0;
        }

        .submit-btn {
            background-color: #ff4500; /* orange-red */
            color: white;
            border: none;
        }

        .submit-btn:hover {
            background-color: #d03801;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h1 class="form-title">Place Your Order</h1>

        <form th:action="@{/save}" th:object="${hotel}" method="post" >
            <div class="mb-3">
                <label for="productname" class="form-label">Product Name:</label>
                <input type="text" th:field="*{productname}" class="form-control" id="productname" required />
            </div>

            <div class="mb-3">
                <label for="quantity" class="form-label">Quantity:</label>
                <input type="text" th:field="*{quantity}" class="form-control" id="quantity" required />
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price:</label>
                <input type="number" th:field="*{price}" class="form-control" id="price" required />
            </div>

            <div class="mb-3">
                <label for="file" class="form-label">Upload Image:</label>
                <input type="file" th:field="*{fileName}" name="file" class="form-control" id="file" />
            </div>

            <div class="text-center">
                <button type="submit" class="btn submit-btn">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
